name: agent-http-integration

on:
  workflow_dispatch:
  push:
    branches: [agent-http]
    paths:
      - 'crates/agent_http/**'
      - 'crates/zed/Cargo.toml'
      - 'crates/zed/src/zed.rs'
      - '.github/workflows/agent-http-integration.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  RUST_BACKTRACE: '1'

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: agent-http-integration
          cache-on-failure: true

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libssl-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-0 \
            libwayland-dev \
            libxcb1-dev \
            libx11-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libasound2-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            protobuf-compiler \
            cmake \
            mold

      - name: cargo check -p zed --features agent_http
        env:
          ZED_CLIENT_CHECKSUM_SEED: ci-placeholder-not-a-secret
        run: cargo check -p zed --features agent_http
