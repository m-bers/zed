[package]
name = "agent_http"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/agent_http.rs"
doctest = false

[[bin]]
name = "agent_http_demo"
path = "src/bin/agent_http_demo.rs"
required-features = ["demo"]

[features]
default = []
# Pulls in agent_ui + workspace so the crate can observe Workspace entities and
# walk their AgentPanel for newly-created AcpThreads. Enabled by the Zed
# binary when the `agent_http` feature there is active.
workspace_discovery = ["dep:agent_ui", "dep:workspace"]
# Builds the standalone `agent_http_demo` binary — useful for smoke-testing
# the HTTP + SSE layer without a full Zed/gpui context.
demo = ["dep:env_logger"]

[dependencies]
acp_thread.workspace = true
agent-client-protocol.workspace = true
agent_ui = { workspace = true, optional = true }
anyhow.workspace = true
collections.workspace = true
futures.workspace = true
gpui.workspace = true
log.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
workspace = { workspace = true, optional = true }

axum = "0.7"
env_logger = { version = "0.11", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net", "io-util", "macros", "signal"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
tokio-stream = { version = "0.1", features = ["sync"] }
