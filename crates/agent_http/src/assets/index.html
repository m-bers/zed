<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Agent Manager</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; padding: 0; height: 100%; background: #0e1014; color: #e5e9f0; font: 14px/1.5 -apple-system, system-ui, sans-serif; }
    header { padding: 12px 16px; border-bottom: 1px solid #1f242c; position: sticky; top: 0; background: #0e1014; z-index: 1; display: flex; justify-content: space-between; align-items: center; }
    header h1 { margin: 0; font-size: 15px; font-weight: 600; }
    main { padding: 12px 16px 120px; }
    .session { padding: 12px; border: 1px solid #1f242c; border-radius: 8px; margin-bottom: 12px; }
    .session-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .session-title { font-weight: 600; }
    .session-actions button { background: transparent; color: #8b95a7; border: 1px solid #2b313c; border-radius: 4px; padding: 3px 8px; font-size: 11px; cursor: pointer; }
    .session-actions button:hover { color: #e5e9f0; }
    .entry { padding: 8px 12px; margin: 6px 0; border-left: 2px solid #2b313c; white-space: pre-wrap; word-wrap: break-word; overflow-wrap: anywhere; }
    .entry.user { border-color: #6cb6ff; }
    .entry.assistant { border-color: #8be9fd; }
    .entry.tool_call { border-color: #f1fa8c; font-family: ui-monospace, SFMono-Regular, monospace; font-size: 12.5px; }
    .entry.plan { border-color: #bd93f9; }
    .empty { color: #6b7280; font-weight: normal; font-size: 12px; margin-left: 8px; }
    .compose { display: flex; gap: 6px; margin-top: 10px; }
    .compose textarea { flex: 1; min-height: 44px; resize: vertical; background: #16181d; color: inherit; border: 1px solid #2b313c; border-radius: 6px; padding: 8px; font: inherit; }
    .compose button { padding: 8px 14px; background: #3b82f6; color: white; border: 0; border-radius: 6px; font-weight: 600; cursor: pointer; }
    .compose button:disabled { opacity: 0.5; cursor: not-allowed; }
    .pending-approval { margin-top: 8px; padding: 10px; background: #1f1608; border: 1px solid #5a3a14; border-radius: 6px; }
    .pending-approval .title { font-weight: 600; color: #f1fa8c; margin-bottom: 6px; }
    .pending-approval .buttons { display: flex; gap: 6px; flex-wrap: wrap; }
    .pending-approval button { padding: 6px 12px; border: 0; border-radius: 4px; font-weight: 600; cursor: pointer; font-size: 12px; }
    .btn-allow { background: #2ea046; color: white; }
    .btn-reject { background: #c53030; color: white; }
  </style>
</head>
<body>
  <header><h1>Agent Manager <span id="status" class="empty">connecting…</span></h1></header>
  <main id="root"><p class="empty">No sessions yet.</p></main>
  <script>
    const sessions = new Map();
    const root = document.getElementById('root');
    const status = document.getElementById('status');

    async function apiPost(path, body) {
      try {
        const res = await fetch(path, {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify(body || {}),
        });
        if (!res.ok) console.error(path, res.status, await res.text());
        return res.ok;
      } catch (err) {
        console.error(path, err);
        return false;
      }
    }

    function render() {
      if (sessions.size === 0) {
        root.innerHTML = '<p class="empty">No sessions yet.</p>';
        return;
      }
      root.innerHTML = '';
      for (const session of sessions.values()) {
        const div = document.createElement('div');
        div.className = 'session';

        const head = document.createElement('div');
        head.className = 'session-header';
        const title = document.createElement('div');
        title.className = 'session-title';
        title.textContent = session.title || session.id;
        head.appendChild(title);
        const actions = document.createElement('div');
        actions.className = 'session-actions';
        const cancelBtn = document.createElement('button');
        cancelBtn.textContent = 'Cancel turn';
        cancelBtn.addEventListener('click', () =>
          apiPost('/api/sessions/' + encodeURIComponent(session.id) + '/cancel')
        );
        actions.appendChild(cancelBtn);
        head.appendChild(actions);
        div.appendChild(head);

        for (const entry of session.entries) {
          if (!entry) continue;
          const e = document.createElement('div');
          e.className = 'entry ' + (entry.kind || 'text') + ' ' + (entry.role || '');
          e.textContent = entry.content || '';
          div.appendChild(e);
        }

        if (session.pending_tool_call) {
          const p = document.createElement('div');
          p.className = 'pending-approval';
          const t = document.createElement('div');
          t.className = 'title';
          t.textContent = 'Awaiting approval for tool call';
          p.appendChild(t);
          const buttons = document.createElement('div');
          buttons.className = 'buttons';
          for (const [label, decision, cls] of [
            ['Allow once', 'allow_once', 'btn-allow'],
            ['Allow always', 'allow_always', 'btn-allow'],
            ['Reject once', 'reject_once', 'btn-reject'],
            ['Reject always', 'reject_always', 'btn-reject'],
          ]) {
            const b = document.createElement('button');
            b.textContent = label;
            b.className = cls;
            b.addEventListener('click', async () => {
              b.disabled = true;
              await apiPost('/api/sessions/' + encodeURIComponent(session.id) + '/approve', { decision });
            });
            buttons.appendChild(b);
          }
          p.appendChild(buttons);
          div.appendChild(p);
        }

        const compose = document.createElement('form');
        compose.className = 'compose';
        const ta = document.createElement('textarea');
        ta.placeholder = 'Send a message…';
        const btn = document.createElement('button');
        btn.textContent = 'Send';
        btn.type = 'submit';
        compose.appendChild(ta);
        compose.appendChild(btn);
        compose.addEventListener('submit', async (ev) => {
          ev.preventDefault();
          const content = ta.value.trim();
          if (!content) return;
          btn.disabled = true;
          const ok = await apiPost('/api/sessions/' + encodeURIComponent(session.id) + '/prompt', { content });
          if (ok) ta.value = '';
          btn.disabled = false;
        });
        div.appendChild(compose);
        root.appendChild(div);
      }
    }

    function ensureSession(id, title) {
      if (!sessions.has(id)) {
        sessions.set(id, { id, title: title || null, entries: [], pending_tool_call: null });
      } else if (title) {
        sessions.get(id).title = title;
      }
      return sessions.get(id);
    }

    fetch('/api/sessions').then(r => r.json()).then(initial => {
      for (const s of initial) ensureSession(s.session_id, s.title);
      render();
    });

    const es = new EventSource('/api/events');
    es.addEventListener('open', () => { status.textContent = 'live'; status.className = ''; });
    es.addEventListener('error', () => { status.textContent = 'reconnecting…'; status.className = 'empty'; });
    es.addEventListener('snapshot', (ev) => {
      try {
        const evt = JSON.parse(ev.data);
        switch (evt.type) {
          case 'thread_discovered':
            ensureSession(evt.session_id, evt.title);
            break;
          case 'title_changed':
            ensureSession(evt.session_id).title = evt.title;
            break;
          case 'entry_added':
          case 'entry_updated': {
            const s = ensureSession(evt.session_id);
            s.entries[evt.entry_index] = { role: evt.role, kind: evt.kind, content: evt.content };
            break;
          }
          case 'tool_authorization_requested':
            ensureSession(evt.session_id).pending_tool_call = evt.tool_call_id;
            break;
          case 'tool_authorization_received':
            ensureSession(evt.session_id).pending_tool_call = null;
            break;
          case 'stopped':
            break;
        }
        render();
      } catch (err) {
        console.error(err);
      }
    });
  </script>
</body>
</html>
